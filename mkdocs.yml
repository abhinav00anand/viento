site_name: Viento Documentation
site_description: Distributed AI Inference Mesh Network & SDK
site_author: Viento Team
site_url: https://viento.readthedocs.io/
repo_url: https://github.com/abhinav00anand/viento
repo_name: abhinav00anand/viento
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Scheme toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Scheme toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - CLI Reference: cli_guide.md
  - Engine Integrations:
      - Ollama Deep Dive: ollama_integration_guide.md
      - Complete Run Guide: RUN_GUIDE.md
  - Changelog: changelog.md
