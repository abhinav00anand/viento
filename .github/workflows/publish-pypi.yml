name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auto-Bump Version per Commit / Build
        run: |
          python -c "
          import re

          run_num = '${{ github.run_number }}'
          new_ver = f'0.4.{run_num}'

          # Update pyproject.toml
          with open('pyproject.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          updated = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"{new_ver}\"', content)
          with open('pyproject.toml', 'w', encoding='utf-8') as f:
              f.write(updated)

          # Update viento/__init__.py
          with open('viento/__init__.py', 'r', encoding='utf-8') as f:
              content = f.read()
          updated = re.sub(r'__version__\s*=\s*\"[^\"]+\"', f'__version__ = \"{new_ver}\"', content)
          with open('viento/__init__.py', 'w', encoding='utf-8') as f:
              f.write(updated)

          print(f'==> Successfully updated package version to: {new_ver}')
          "

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify Distribution Artifacts
        run: |
          twine check dist/*

      - name: Store Distribution Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Distribution Packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify Package Files
        run: |
          ls -la dist/

      - name: Publish to PyPI via API Token or OIDC
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "==> Uploading packages to PyPI via API Token..."
            twine upload dist/* -u __token__ -p "$PYPI_API_TOKEN" --skip-existing --verbose
          else
            echo "::error::PYPI_API_TOKEN secret is not set in GitHub repository secrets!"
            echo "Please configure PYPI_API_TOKEN under Settings -> Secrets and variables -> Actions"
            exit 1
          fi
